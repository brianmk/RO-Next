[package]
name = "ragnarok-packets"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = { workspace = true }
ro-next-interface = { workspace = true, optional = true }
rust-state = { workspace = true, optional = true }
ragnarok-bytes = { workspace = true, features = ["derive"] }
ragnarok-macros = { workspace = true }

[dev-dependencies]
etherparse = { workspace = true }
ro-next-debug = { workspace = true }
pcap = { workspace = true }

[features]
debug = []
derive = []
interface = ["ro-next-interface", "rust-state"]
packet-to-state-element = ["interface"]
unicode = ["ro-next-debug/unicode"]

[lints.clippy]
# P0-6 hardening: no panics on data the server (or the game files) can send us.
# Production paths must return a `Result` or fall back to a logged default;
# genuine start-up invariants document their exception with
# `#[expect(clippy::..., reason = "...")]` at the call site.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
