[package]
name = "ro-next"
version = "0.2.32"
edition.workspace = true
license.workspace = true

[dependencies]
arrayvec = { workspace = true }
blake3 = { workspace = true, features = ["std"] }
block_compression = { workspace = true, features = ["bc7", "wgpu"] }
bumpalo = { workspace = true, features = ["allocator_api"] }
bytemuck = { workspace = true, features = ["derive", "extern_crate_std", "min_const_generics"] }
cgmath = { workspace = true, features = ["mint", "serde"] }
clap = { workspace = true, features = ["derive"] }
cosmic-text = { workspace = true, features = ["std", "fontconfig"] }
ctrlc = { workspace = true }
ddsfile = { workspace = true }
encoding_rs = { workspace = true }
fast-srgb8 = { workspace = true }
flate2 = { workspace = true, features = ["zlib-rs"] }
hashbrown = { workspace = true, features = ["serde"] }
image = { workspace = true, features = ["bmp", "jpeg", "png", "tga", "rayon"] }
ro-next-audio = { workspace = true }
ro-next-components = { path = "components" }
ro-next-collision = { workspace = true, features = ["interface"] }
ro-next-container = { workspace = true, features = ["interface"] }
ro-next-debug = { workspace = true, optional = true }
ro-next-interface = { workspace = true, features = ["serde", "cgmath", "theme-element"] }
ro-next-loaders = { workspace = true }
ro-next-messages = { workspace = true }
ro-next-networking = { workspace = true, features = ["interface"] }
ro-next-video = { workspace = true }
libc = { workspace = true }
lunify = { workspace = true }
mlua = { workspace = true, features = ["lua51", "vendored"] }
num = { workspace = true }
option-ext = { workspace = true }
pollster = { workspace = true }
quick-xml = { workspace = true, features = ["serde", "serialize"] }
ragnarok-bytes = { workspace = true, features = ["derive", "cgmath"] }
ragnarok-formats = { workspace = true, features = ["interface"] }
ragnarok-packets = { workspace = true, features = ["derive", "interface", "packet-to-state-element"] }
rand_aes = { workspace = true, features = ["tls", "tls_aes128_ctr128"] }
rayon = { workspace = true }
ron = { workspace = true }
rust-state = { workspace = true }
serde = { workspace = true }
sevenz-rust2 = { workspace = true, features = ["compress"] }
smallvec = { workspace = true, features = ["const_generics", "const_new", "union"] }
sys-locale = { workspace = true }
ttf-parser = { workspace = true, features = ["std"] }
walkdir = { workspace = true }
# wgpu loads `dxcompiler.dll` dynamically on Windows (the `static-dxc` feature
# would statically link Mach's DXC build, which needs MSVC ATL and cannot be
# cross-compiled from Linux). The Windows payload ships dxcompiler.dll + dxil.dll.
wgpu = { workspace = true, features = ["spirv"] }
winit = { workspace = true }

[build-dependencies]
sevenz-rust2 = { workspace = true, features = ["compress"] }

[features]
debug = ["ro-next-audio/debug", "ro-next-debug", "ro-next-interface/debug"]
unicode = ["ro-next-debug/unicode"]
