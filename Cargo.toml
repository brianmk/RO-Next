[workspace]
resolver = "3"
members = ["ro-next", "ragnarok-*", "ro-next-*"]

[workspace.dependencies]
arrayvec = "0.7"
bitflags = "2"
blake3 = { version = "1", default-features = true }
block_compression = { version = "0.9", default-features = false }
bumpalo = "3"
bytemuck = "1"
cgmath = "0.18"
chrono = "0.4"
clap = "4"
cosmic-text = { version = "0.18", default-features = false }
cpal = "0.17"
ctrlc = "3"
ddsfile = "0.6"
encoding_rs = "0.8"
etherparse = "0.20"
fast-srgb8 = "1"
flate2 = { version = "1", default-features = false }
hashbrown = "0.17"
heck = "0.5"
image = { version = "0.25", default-features = false }
ro-next-audio = { path = "ro-next-audio" }
ro-next-collision = { path = "ro-next-collision" }
ro-next-container = { path = "ro-next-container" }
ro-next-debug = { path = "ro-next-debug" }
ro-next-interface = { path = "ro-next-interface" }
ro-next-loaders = { path = "ro-next-loaders" }
ro-next-messages = { path = "ro-next-messages" }
ro-next-networking = { path = "ro-next-networking" }
ro-next-video = { path = "ro-next-video" }
libc = "0.2"
lunify = "1"
mlua = "0.11"
num = "0.4"
option-ext = "0.2"
pcap = "2"
pollster = "0.4"
proc-macro2 = "1"
quick-xml = "0.39"
quote = "1"
ragnarok-bytes = { path = "ragnarok-bytes" }
ragnarok-formats = { path = "ragnarok-formats" }
ragnarok-macros = { path = "ragnarok-macros" }
ragnarok-packets = { path = "ragnarok-packets" }
rand_aes = { version = "0.6", default-features = false }
rav1d = { version = "1", git = "https://github.com/memorysafety/rav1d.git", rev = "c8019327ff0aa4c097475fa5f679561ea3abd983" }
rayon = "1"
reqwest = "0.13"
resampler = "0.5"
ron = "0.12"
rtrb = "0.3"
rust-state = { git = "https://github.com/vE5li/rust-state" }
symphonia = { version = "0.5", default-features = false }
send_wrapper = "0.6"
serde = "1"
sevenz-rust2 = { version = "0.21", default-features = false }
smallvec = "1"
syn = "2"
sys-locale = "0.3"
tokio = { version = "1", default-features = false }
ttf-parser = { version = "0.25", default-features = false }
walkdir = "2"
wgpu = "29"
winit = "0.30"

[profile.release]
lto = "thin"

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false

[profile.dev.package.wgpu-core]
opt-level = 3
debug-assertions = false

[profile.dev.package.ro-next]
opt-level = 0

[profile.dev.package.ro-next-audio]
opt-level = 3

[profile.dev.package.ro-next-collision]
opt-level = 3

[profile.dev.package.ro-next-container]
opt-level = 3

[profile.dev.package.ro-next-debug]
opt-level = 3

[profile.dev.package.ro-next-interface]
opt-level = 3

[profile.dev.package.ro-next-messages]
opt-level = 3

[profile.dev.package.ro-next-networking]
opt-level = 3

[profile.dev.package.ro-next-loaders]
opt-level = 3

[profile.dev.package.ro-next-video]
opt-level = 3

[profile.dev.package.ragnarok-bytes]
opt-level = 3

[profile.dev.package.ragnarok-formats]
opt-level = 3

[profile.dev.package.ragnarok-macros]
opt-level = 3

[profile.dev.package.ragnarok-packets]
opt-level = 3
