on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main

# Cancel previous jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Tests

env:
  CARGO_TERM_COLOR: always
  SLANG_VERSION: v2025.18.2

jobs:
  build:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt update && sudo apt install libpcap-dev libasound2-dev nasm

      - name: Cache slangc
        id: cache-slangc
        uses: actions/cache@v4
        with:
          path: ~/slangc
          key: ${{ runner.os }}-slangc-${{ env.SLANG_VERSION }}

      - name: Download and install slangc
        if: steps.cache-slangc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/slangc
          cd ~/slangc

          VERSION_NO_V=${SLANG_VERSION#v}
          curl -L -o slang-linux-x86_64.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/${{ env.SLANG_VERSION }}/slang-${VERSION_NO_V}-linux-x86_64.tar.gz"

          tar -xzf slang-linux-x86_64.tar.gz
          rm slang-linux-x86_64.tar.gz

          chmod +x bin/slangc bin/slangd

      - name: Add slangc to PATH
        run: echo "$HOME/slangc/bin" >> $GITHUB_PATH

      - name: Verify slangc installation
        run: |
          which slangc
          slangc -version

      - name: Run unit tests
        run: cargo test --all-features

      # Data-generated content (status effects) is checked into the tree. The
      # generator's --check mode is the drift guard: CI fails when the committed
      # RON file does not match the committed facts JSON, or when the parity /
      # schema invariants of the data test fail. Neither step needs the game
      # data or the server tree.
      - name: Check generated status-effect data
        run: |
          ./tools/gen_status_effects.py --check
          ./tools/test_status_effects_data.py

      # Skill behaviour / procedural effect data is hand-curated; the generator
      # --check and the data tests need no game files. The full skill-sound
      # generator --check needs the CondaRO GRFs (manual verification); the
      # offline test below verifies the curated merge.
      - name: Check generated skill data
        run: |
          ./tools/gen_skills.py --check
          ./tools/test_skills_data.py
          ./tools/test_skill_sounds_data.py
